name: Release (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android (APK)'
        type: boolean
        required: true
        default: true
      build_ios:
        description: 'Build iOS (unsigned IPA)'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Read Version
    # Version শুধু package.json থেকে পড়া হয় (একটাই source of truth);
    # versionCode gradle নিজে app.config.js থেকে পায়।
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
      build_android: ${{ steps.flags.outputs.build_android }}
      build_ios: ${{ steps.flags.outputs.build_ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and date
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Resolve platform flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_android=${{ github.event.inputs.build_android }}" >> $GITHUB_OUTPUT
            echo "build_ios=${{ github.event.inputs.build_ios }}" >> $GITHUB_OUTPUT
          else
            # Tag push হলে সব platform build হবে
            echo "build_android=true" >> $GITHUB_OUTPUT
            echo "build_ios=true" >> $GITHUB_OUTPUT
          fi

  android:
    name: Android Build
    needs: version
    if: needs.version.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: playstore
      NODE_ENV: production
      # Torrent engine (libtorrent4j + stream proxy) is wanted in these APKs:
      # without it torrent sources fail to resolve and torrent downloads fail.
      INCLUDE_TORRENT: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Firebase config (google-services.json)
        run: |
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_B64 }}" | base64 --decode > google-services.json
            echo "Firebase config decoded ($(wc -c < google-services.json) bytes)"
          else
            echo "No FIREBASE_GOOGLE_SERVICES_B64 secret: building WITHOUT Firebase push"
          fi

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret found, will build debug APK"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          MYAPP_UPLOAD_STORE_FILE: "release.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          MYAPP_UPLOAD_KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          MYAPP_UPLOAD_KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          cd android
          if [ -f app/release.keystore ] && [ -s app/release.keystore ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(realpath app/release.keystore) \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              -Pandroid.abiFilters=arm64-v8a \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
              --no-daemon --stacktrace
          else
            echo "No valid keystore found, building debug APK..."
            ./gradlew assembleDebug \
              -Pandroid.abiFilters=arm64-v8a \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
              --no-daemon --stacktrace
          fi

      - name: Collect APKs
        id: apks
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BUILD_DATE="${{ needs.version.outputs.build_date }}"
          mkdir -p apks

          UNIVERSAL_APK=$(find android/app/build/outputs/apk -name "*universal*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          ARMV8_APK=$(find android/app/build/outputs/apk -name "*arm64-v8a*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug*.apk" 2>/dev/null | head -1)

          APK_PATHS=""

          if [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "apks/CineBD-v${VERSION}-universal-${BUILD_DATE}.apk"
            APK_PATHS="${APK_PATHS}apks/CineBD-v${VERSION}-universal-${BUILD_DATE}.apk,"
          fi

          if [ -f "$ARMV8_APK" ]; then
            cp "$ARMV8_APK" "apks/CineBD-v${VERSION}-armv8-${BUILD_DATE}.apk"
            APK_PATHS="${APK_PATHS}apks/CineBD-v${VERSION}-armv8-${BUILD_DATE}.apk,"
          fi

          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "apks/CineBD-v${VERSION}-debug-${BUILD_DATE}.apk"
            APK_PATHS="${APK_PATHS}apks/CineBD-v${VERSION}-debug-${BUILD_DATE}.apk,"
          fi

          APK_PATHS=$(echo "$APK_PATHS" | sed 's/,$//')
          echo "apk_paths=${APK_PATHS}" >> $GITHUB_OUTPUT
          echo "APKs built:"
          ls -la apks/

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-v${{ needs.version.outputs.version }}
          path: apks/*.apk
          if-no-files-found: error

  ios:
    name: iOS Build (Unsigned)
    needs: version
    if: needs.version.outputs.build_ios == 'true'
    runs-on: macos-latest
    env:
      APP_VARIANT: playstore
      NODE_ENV: production
      # APK workflow-এর convention: torrent engine ছাড়া (libtorrent android-only,
      # এখানে শুধু JS-side guard-এর জন্য unset রাখা হলো)।
      INCLUDE_TORRENT: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      # prebuild --no-install দিলে node_modules-ই থাকে না, তাই আগে
      # dependencies install করে নেওয়া হয়েছে।
      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select bundler
        run: bundle config set --local path 'vendor/bundle'

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods (bundler)
        run: |
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Decode Firebase config (GoogleService-Info.plist)
        run: |
          if [ -n "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_B64 }}" ]; then
            echo "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_B64 }}" | base64 --decode > ios/GoogleService-Info.plist
            echo "Firebase plist decoded ($(wc -c < ios/GoogleService-Info.plist) bytes)"
          else
            echo "No IOS_GOOGLE_SERVICES_PLIST_B64 secret: building WITHOUT Firebase push"
          fi

      - name: Build JS bundle (react-native bundle)
        run: npx react-native bundle \
          --platform ios \
          --dev false \
          --entry-file index.js \
          --bundle-output ios/main.jsbundle \
          --assets-dest ios

      - name: Build app without codesign (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Cinepix.xcworkspace \
            -scheme Cinepix \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_test/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee xcodebuild.log \
            | xcbeautify

      - name: Package unsigned IPA (Payload)
        run: |
          APP=$(find build_test/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in Release-iphoneos"
            find build_test/ios/Build/Products -maxdepth 2 -type d
            exit 1
          fi
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA_NAME="Cinepix-v${{ needs.version.outputs.version }}-ios-unsigned-${{ needs.version.outputs.build_date }}.ipa"
          zip -r "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-v${{ needs.version.outputs.version }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, android, ios]
    # দুই platform-এর মধ্যে যেকোনো একটা build সফল হলেই release হবে;
    # একটা fail করলেও অন্যটার asset হারাবে না (fail-fast নেই)।
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android artifacts
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apks-v${{ needs.version.outputs.version }}
          path: release-assets/

      - name: Download iOS artifact
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-v${{ needs.version.outputs.version }}
          path: release-assets/

      - name: Get commit info
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_ENV
          MSG=$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9 .,;:_()-]//g')
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV
          AUTHOR=$(git log -1 --pretty=%an)
          echo "COMMIT_AUTHOR=$AUTHOR" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}-{1}', needs.version.outputs.version, needs.version.outputs.build_date) || github.ref_name }}
          name: 'Cinepix v${{ needs.version.outputs.version }} (${{ needs.version.outputs.build_date }})'
          body: |
            **Version:** v${{ needs.version.outputs.version }}
            **Build Date:** ${{ needs.version.outputs.build_date }}
            **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ env.COMMIT_AUTHOR }}
            **Commit Message:** ${{ env.COMMIT_MSG }}

            ---
            ${{ needs.android.result == 'success' && '✅ Android APK (signed release / debug fallback)' || '❌ Android build skipped/failed' }}
            ${{ needs.ios.result == 'success' && '⚠️ iOS unsigned IPA — Sideloadly / AltStore দিয়ে sign করে install করতে হবে' || '❌ iOS build skipped/failed' }}
          files: release-assets/*
          draft: false
          prerelease: false
