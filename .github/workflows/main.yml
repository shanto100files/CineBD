name: Custom Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: playstore
      NODE_ENV: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_ENV
          MSG=$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9 .,;:_()-]//g')
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV
          AUTHOR=$(git log -1 --pretty=%an)
          echo "COMMIT_AUTHOR=$AUTHOR" >> $GITHUB_ENV
          DATE=$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          echo "COMMIT_DATE=$DATE" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret found, will build debug APK"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          MYAPP_UPLOAD_STORE_FILE: "release.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          MYAPP_UPLOAD_KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          MYAPP_UPLOAD_KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          cd android
          if [ -f app/release.keystore ] && [ -s app/release.keystore ]; then
            echo "Building signed release APK..."
            # Copy keystore to app folder where with-signing.gradle expects it if relative to android/app
            # The with-signing script does file(envStoreFile) inside android/app context? 
            # No, standard Gradle file() is relative to the project/module directory.
            # with-signing.gradle is applied in app/build.gradle, so it's relative to android/app.
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(realpath app/release.keystore) \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              -Pandroid.abiFilters=arm64-v8a \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
              --no-daemon --stacktrace
          else
            echo "No valid keystore found, building debug APK..."
            ./gradlew assembleDebug \
              -Pandroid.abiFilters=arm64-v8a \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
              --no-daemon --stacktrace
          fi

      - name: Identify APKs
        id: apk_files
        run: |
          VERSION=$(grep -m 1 "versionName " android/app/build.gradle | sed 's/.*versionName "\(.*\)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          mkdir -p apks

          UNIVERSAL_APK=$(find android/app/build/outputs/apk -name "*universal*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          ARMV7_APK=$(find android/app/build/outputs/apk -name "*armeabi-v7a*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          ARMV8_APK=$(find android/app/build/outputs/apk -name "*arm64-v8a*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          DEBUG_APK=$(find android/app/build/outputs/apk -name "*debug*.apk" 2>/dev/null | head -1)

          APK_PATHS=""

          if [ -f "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK_NAME="CineBD-v${VERSION}-universal-${BUILD_DATE}.apk"
            cp "$UNIVERSAL_APK" "apks/${UNIVERSAL_APK_NAME}"
            echo "UNIVERSAL_APK_NAME=${UNIVERSAL_APK_NAME}" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${UNIVERSAL_APK_NAME},"
          fi

          if [ -f "$ARMV7_APK" ]; then
            ARMV7_APK_NAME="CineBD-v${VERSION}-armv7-${BUILD_DATE}.apk"
            cp "$ARMV7_APK" "apks/${ARMV7_APK_NAME}"
            echo "ARMV7_APK_NAME=${ARMV7_APK_NAME}" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${ARMV7_APK_NAME},"
          fi

          if [ -f "$ARMV8_APK" ]; then
            ARMV8_APK_NAME="CineBD-v${VERSION}-armv8-${BUILD_DATE}.apk"
            cp "$ARMV8_APK" "apks/${ARMV8_APK_NAME}"
            echo "ARMV8_APK_NAME=${ARMV8_APK_NAME}" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${ARMV8_APK_NAME},"
          fi

          if [ -f "$DEBUG_APK" ]; then
            DEBUG_APK_NAME="CineBD-v${VERSION}-debug-${BUILD_DATE}.apk"
            cp "$DEBUG_APK" "apks/${DEBUG_APK_NAME}"
            echo "DEBUG_APK_NAME=${DEBUG_APK_NAME}" >> $GITHUB_ENV
            APK_PATHS="${APK_PATHS}apks/${DEBUG_APK_NAME},"
          fi

          APK_PATHS=$(echo $APK_PATHS | sed 's/,$//')
          echo "apk_paths=${APK_PATHS}" >> $GITHUB_OUTPUT

          RELEASE_TAG="custom-$(date -u '+%Y%m%d')"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          echo "APKs built:"
          ls -la apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'Custom Build v${{ env.APP_VERSION }} (${{ env.BUILD_DATE }})'
          body: |
            > ⚠️ **CUSTOM BUILD** ⚠️  
            > This is a custom build, not official release.

            **Version:** v${{ env.APP_VERSION }}
            **Build Date:** ${{ env.BUILD_DATE }}
            **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ env.COMMIT_AUTHOR }}
            **Commit Message:** ${{ env.COMMIT_MSG }}
          files: ${{ steps.apk_files.outputs.apk_paths }}
          draft: false
          prerelease: false

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineBD-v${{ env.APP_VERSION }}-${{ env.BUILD_DATE }}
          path: apks/*.apk
          if-no-files-found: warn
