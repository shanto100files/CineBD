name: iOS Build (Unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    env:
      APP_VARIANT: playstore
      NODE_ENV: production
      # APK workflow-এর convention: torrent engine ছাড়া (libtorrent android-only,
      # এখানে শুধু JS-side guard-এর জন্য unset রাখা হলো)।
      INCLUDE_TORRENT: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_ENV
          MSG=$(git log -1 --pretty=%s | sed 's/[^a-zA-Z0-9 .,;:_()-]//g')
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV
          AUTHOR=$(git log -1 --pretty=%an)
          echo "COMMIT_AUTHOR=$AUTHOR" >> $GITHUB_ENV
          DATE=$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          echo "COMMIT_DATE=$DATE" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      # Android workflow-তে prebuild --no-install দেওয়া হয়; iOS-এর ক্ষেত্রে
      # --no-install দিলে node_modules-ই থাকে না, তাই prebuild-এর আগে
      # dependencies install করে নেওয়া হয়েছে।
      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select bundler
        run: bundle config set --local path 'vendor/bundle'

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods (bundler)
        run: |
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Decode Firebase config (GoogleService-Info.plist)
        run: |
          if [ -n "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_B64 }}" ]; then
            echo "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_B64 }}" | base64 --decode > ios/GoogleService-Info.plist
            echo "Firebase plist decoded ($(wc -c < ios/GoogleService-Info.plist) bytes)"
          else
            echo "No IOS_GOOGLE_SERVICES_PLIST_B64 secret: building WITHOUT Firebase push"
          fi

      - name: Read app version
        run: |
          VERSION=$(grep -m 1 "MARKETING_VERSION" ios/Cinepix.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);.*/\1/' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build JS bundle (react-native bundle)
        run: npx react-native bundle \
          --platform ios \
          --dev false \
          --entry-file index.js \
          --bundle-output ios/main.jsbundle \
          --assets-dest ios

      - name: Build app without codesign (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Cinepix.xcworkspace \
            -scheme Cinepix \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_test/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee xcodebuild.log \
            | xcbeautify

      - name: Package unsigned IPA (Payload)
        run: |
          APP=$(find build_test/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in Release-iphoneos"
            find build_test/ios/Build/Products -maxdepth 2 -type d
            exit 1
          fi
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA_NAME="Cinepix-v${APP_VERSION}-ios-unsigned-${BUILD_DATE}.ipa"
          zip -r "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Cinepix iOS v${{ env.APP_VERSION }} (${{ env.BUILD_DATE }})'
          body: |
            > **UNSIGNED iOS BUILD**
            > Sideloadly / AltStore / TrollStore দিয়ে sign করে install করতে হবে।

            **Version:** v${{ env.APP_VERSION }}
            **Build Date:** ${{ env.BUILD_DATE }}
            **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) by ${{ env.COMMIT_AUTHOR }}
            **Commit Message:** ${{ env.COMMIT_MSG }}
          files: ${{ env.IPA_NAME }}
          draft: false
          prerelease: false
